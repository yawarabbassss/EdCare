version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: leo_postgres
    environment:
      POSTGRES_DB: leo_care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: leo_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/leo_care
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: leo-care-secret-key-production-change-in-prod
      AI_PROVIDER: local
      FALL_CONFIRMATION_SECONDS: 2.5
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: leo_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
